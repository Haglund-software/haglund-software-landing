<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			// Apply the saved or OS theme before first paint. Keep in sync with src/lib/theme.ts.
			try {
				var t = localStorage.getItem('theme');
				if (t !== 'haglund-light' && t !== 'haglund-dark') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'haglund-dark' : 'haglund-light';
				}
				document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte-app">%sveltekit.body%</div>
	</body>
</html>
